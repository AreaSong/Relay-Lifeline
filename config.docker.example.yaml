schema-version: 1

server:
  listen: "0.0.0.0:8318"
  admin-enabled: true
  config-backup-dir: "/var/lib/relay-lifeline/captures/config-backups"
  read-header-timeout: "10s"
  shutdown-timeout: "3m"
  max-request-body: "32MiB"

upstream:
  base-url: "http://host.docker.internal:8317"
  connect-timeout: "10s"
  response-header-timeout: "30s"
  response-body-idle-timeout: "90s"

retry:
  enabled: true
  mode: "all-errors"
  min-interval: "60s"
  max-interval: "120s"
  max-attempts: 0
  honor-retry-after: true

stream:
  heartbeat-interval: "15s"
  memory-limit: "64MiB"
  temp-dir: ""

queue:
  max-active: 8
  max-waiting: 100
  recovery-spacing: "2s"

history:
  max-items: 500
  retention: "24h"

observability:
  error-details: "safe"
  max-error-detail: "2KiB"

capture:
  enabled: false
  storage-dir: "/var/lib/relay-lifeline/captures"
  retention: "72h"
  default-request-limit: 3
  activation-timeout: "10m"
  max-body-size: "64MiB"
  max-total-size: "1GiB"
  max-attempts-per-request: 20
  minimum-free-disk: "1GiB"
  log-max-items: 2000
  log-retention: "1h"

risk:
  warning-after: "15m"
  warning-attempts: 10
  auth-error-attempts: 3
  queue-warning-percent: 80
  minimum-free-disk: "512MiB"

localization:
  default-locale: "zh-CN"
  fallback-locale: "en-US"

notifications:
  stalled-after: "10m"
  notify-on-recovery: true
  webhook-url: ""
  delivery-attempts: 3
  delivery-backoff: "5s"
  locale: "zh-CN"
  event-types:
    - stalled
    - recovered
    - long_running
    - many_attempts
    - auth_errors
    - queue_pressure
    - disk_pressure

logging:
  level: "info"
  locale: "zh-CN"
  log-request-body: false
  log-response-body: false
  log-authorization: false
