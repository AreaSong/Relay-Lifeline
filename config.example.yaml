schema-version: 3

server:
  listen: "127.0.0.1:8318"
  admin-enabled: true
  config-backup-dir: ""
  read-header-timeout: "10s"
  shutdown-timeout: "3m"
  max-request-body: "32MiB"

upstream:
  base-url: "http://cli-proxy-api:8317"
  connect-timeout: "10s"
  response-header-timeout: "30s"
  response-body-idle-timeout: "90s"

retry:
  enabled: true
  mode: "all-errors"
  min-interval: "60s"
  max-interval: "120s"
  max-attempts: 0
  honor-retry-after: true

stream:
  heartbeat-interval: "15s"
  memory-limit: "64MiB"
  max-response-body: "512MiB"
  max-total-cache: "2GiB"
  temp-dir: ""

queue:
  max-active: 8
  max-waiting: 100
  recovery-spacing: "2s"

history:
  max-items: 500
  retention: "24h"

observability:
  error-details: "safe"
  max-error-detail: "2KiB"

capture:
  enabled: false
  storage-dir: "/var/lib/relay-lifeline/captures"
  retention: "72h"
  default-request-limit: 3
  activation-timeout: "10m"
  max-body-size: "64MiB"
  max-total-size: "1GiB"
  max-attempts-per-request: 20
  minimum-free-disk: "1GiB"
  log-max-items: 2000
  log-retention: "1h"

risk:
  warning-after: "15m"
  warning-attempts: 10
  auth-error-attempts: 3
  queue-warning-percent: 80
  minimum-free-disk: "512MiB"

localization:
  default-locale: "zh-CN"
  fallback-locale: "en-US"

notifications:
  stalled-after: "10m"
  notify-on-recovery: true
  webhook-url: ""
  delivery-attempts: 3
  delivery-backoff: "5s"
  locale: "zh-CN"
  event-types:
    - stalled
    - recovered
    - long_running
    - many_attempts
    - auth_errors
    - queue_pressure
    - disk_pressure

logging:
  level: "info"
  locale: "zh-CN"
  log-request-body: false
  log-response-body: false
  log-authorization: false

persistence:
  enabled: true
  directory: "/var/lib/relay-lifeline/events"
  retention: "336h"
  sync-writes: true

incidents:
  enabled: true
  correlation-window: "30s"
  recovery-stable-window: "2m"
  retention: "720h"
  max-items: 1000

lifecycle:
  track-uncertain-delivery: true
  preserve-idempotency-key: true
  generate-idempotency-key: false
  max-request-duration: "0s"
  client-disconnect-policy: "cancel"

management-security:
  login-failures-per-minute: 5
  login-cooldown: "30s"
  session-idle-timeout: "30m"

metrics-export:
  enabled: false
  path: "/metrics"
