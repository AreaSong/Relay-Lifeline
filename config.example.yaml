schema-version: 5

server:
  listen: "127.0.0.1:8318"
  admin-enabled: true
  config-backup-dir: ""
  read-header-timeout: "10s"
  read-body-timeout: "60s"
  idle-timeout: "90s"
  downstream-write-idle-timeout: "30s"
  shutdown-timeout: "3m"
  max-header-bytes: 1048576
  max-request-body: "32MiB"

upstream:
  base-url: "http://cli-proxy-api:8317"
  connect-timeout: "10s"
  response-header-timeout: "30s"
  response-body-idle-timeout: "90s"

egress:
  deny-private-networks: true
  allowed-hosts:
    - "cli-proxy-api"
    # Add every explicitly approved webhook/telemetry/upstream hostname here.

retry:
  enabled: true
  mode: "all-errors"
  min-interval: "60s"
  max-interval: "120s"
  max-attempts: 0
  max-elapsed: "0s"
  retry-after-cap: "10m"
  honor-retry-after: true

stream:
  heartbeat-interval: "15s"
  memory-limit: "64MiB"
  max-response-body: "512MiB"
  max-total-cache: "2GiB"
  temp-dir: ""

queue:
  max-active: 8
  max-waiting: 100
  recovery-spacing: "2s"

history:
  max-items: 500
  retention: "24h"

observability:
  error-details: "safe"
  max-error-detail: "2KiB"
  telemetry:
    enabled: false
    protocol: "grpc"
    endpoint: "localhost:4317"
    insecure: false
    sample-ratio: 1
    service-name: "relay-lifeline"
    environment: "production"
    export-timeout: "10s"
    metric-interval: "60s"

capture:
  enabled: false
  storage-dir: "/var/lib/relay-lifeline/captures"
  retention: "72h"
  default-request-limit: 3
  activation-timeout: "10m"
  max-body-size: "64MiB"
  max-total-size: "1GiB"
  max-attempts-per-request: 20
  minimum-free-disk: "1GiB"
  log-max-items: 2000
  log-retention: "1h"

risk:
  warning-after: "15m"
  warning-attempts: 10
  auth-error-attempts: 3
  queue-warning-percent: 80
  minimum-free-disk: "512MiB"

localization:
  default-locale: "zh-CN"
  fallback-locale: "en-US"

notifications:
  stalled-after: "10m"
  notify-on-recovery: true
  webhook-url: ""
  delivery-attempts: 3
  delivery-backoff: "5s"
  locale: "zh-CN"
  event-types:
    - stalled
    - recovered
    - long_running
    - many_attempts
    - auth_errors
    - queue_pressure
    - disk_pressure
    - governance_ledger_failed
    - uncertain_delivery
    - uncertain_slo_breach
    - uncertain_resolved

logging:
  level: "info"
  locale: "zh-CN"
  log-request-body: false
  log-response-body: false
  log-authorization: false

persistence:
  enabled: true
  directory: "/var/lib/relay-lifeline/events"
  retention: "336h"
  sync-writes: true

incidents:
  enabled: true
  correlation-window: "30s"
  recovery-stable-window: "2m"
  retention: "720h"
  max-items: 1000

lifecycle:
  track-uncertain-delivery: true
  preserve-idempotency-key: true
  generate-idempotency-key: false
  allow-uncertain-retry: false
  uncertain-resolution-target: "15m"
  allow-cross-domain-failover: false
  max-request-duration: "0s"
  client-disconnect-policy: "cancel"

management-security:
  local-access-enabled: true
  login-failures-per-minute: 5
  login-cooldown: "30s"
  session-idle-timeout: "30m"
  session-max-lifetime: "8h"
  oidc:
    enabled: false
    issuer-url: ""
    client-id: ""
    redirect-url: ""
    scopes: []
    signing-algorithms: ["RS256"]
    role-claim: "groups"
    viewer-values: []
    operator-values: []
    sensitive-values: []

metrics-export:
  enabled: false
  path: "/metrics"

governance:
  mode: "observe"
  unknown-usage-policy: "observe"
  max-concurrent: 0
  requests-per-minute: 0
  token-limit: 0
  cost-limit-micros: 0
  token-reservation: 0
  cost-reservation-micros: 0
  reservation-min-tokens: 256
  reservation-max-tokens: 4096
  reservation-min-cost-micros: 0
  reservation-max-cost-micros: 0
  soft-threshold-percent: 80
  forecast-window: "1h"
  budgets: []
  prices: []

slo:
  enabled: true
  availability-target: 0.99
  recovery-latency-target: "30s"
  window: "24h"

traffic-policy:
  enabled: false
  mode: "observe"
  rules: []
  shadow:
    enabled: false
    target-id: "primary"
    sample-percent: 0
    max-concurrent: 1
    max-request-body: "1MiB"
    request-budget-per-hour: 0
    cost-budget-micros-per-hour: 0
    cost-reservation-micros: 1000
    require-idempotency: true
  adaptive:
    enabled: false
    error-budget-floor: 0.5
    minimum-observations: 10
    maximum-latency-milliseconds: 30000
