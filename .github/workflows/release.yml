name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/areasong/transfer-lifeline
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          provenance: mode=max
          sbom: true

  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            directory="transfer-lifeline-${version}-${os}-${arch}"
            mkdir -p "dist/${directory}"
            output="dist/${directory}/relay-lifeline"
            if [ "${os}" = windows ]; then output="${output}.exe"; fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
              -ldflags="-s -w -X main.version=${version} -X main.revision=${GITHUB_SHA} -X main.builtAt=${built_at}" \
              -o "${output}" ./cmd/relay-lifeline
            cp LICENSE README.md README.zh-CN.md "dist/${directory}/"
            if [ "${os}" = windows ]; then
              (cd dist && zip -qr "${directory}.zip" "${directory}")
            else
              tar -C dist -czf "dist/${directory}.tar.gz" "${directory}"
            fi
            rm -r "dist/${directory}"
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
