name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release-checks:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run release:check -- "${GITHUB_REF_NAME}"
        working-directory: web

  image:
    needs: [verify, release-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/areasong/relay-lifeline
          tags: |
            type=raw,value=sha-${{ github.sha }}
      - id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Smoke pushed digest
        env:
          IMAGE: ghcr.io/areasong/relay-lifeline
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
          BUILD_TIME: ${{ steps.build-time.outputs.value }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          version="${GITHUB_REF_NAME#v}"
          docker pull "${ref}"
          ./scripts/container-smoke.sh "${ref}" "${version}" "${REVISION}" "${BUILD_TIME}"
          docker buildx imagetools inspect "${ref}" | grep -q 'linux/amd64'
          docker buildx imagetools inspect "${ref}" | grep -q 'linux/arm64'
          previous_tag="$(git tag -l 'v*' --sort=-v:refname | awk -v current="${GITHUB_REF_NAME}" '$0 != current { print; exit }')"
          if [[ -z "${previous_tag}" ]]; then
            if [[ "${RELAY_LIFELINE_ALLOW_NO_PREVIOUS_RELEASE:-false}" != "true" ]]; then
              echo "No previous release tag is available; set RELAY_LIFELINE_ALLOW_NO_PREVIOUS_RELEASE=true only for the first release." >&2
              exit 1
            fi
            echo "Skipping N-1 upgrade smoke because this is an explicitly allowed first release."
          else
            docker pull "${IMAGE}:${previous_tag#v}"
            ./scripts/upgrade-smoke.sh "${IMAGE}:${previous_tag#v}" "${ref}" "${previous_tag}"
          fi
          major="${version%%.*}"
          minor="${version%.*}"
          docker buildx imagetools create -t "${IMAGE}:${version}" "${ref}"
          docker buildx imagetools create -t "${IMAGE}:${major}.${minor}" "${ref}"
          docker buildx imagetools create -t "${IMAGE}:${major}" "${ref}"

  binaries:
    needs: [verify, release-checks, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run l10n:check && npm run build
        working-directory: web
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            directory="relay-lifeline-${version}-${os}-${arch}"
            mkdir -p "dist/${directory}"
            output="dist/${directory}/relay-lifeline"
            if [ "${os}" = windows ]; then output="${output}.exe"; fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
              -ldflags="-s -w -X main.version=${version} -X main.revision=${GITHUB_SHA} -X main.builtAt=${built_at}" \
              -o "${output}" ./cmd/relay-lifeline
            cp LICENSE README.md README.zh-CN.md "dist/${directory}/"
            if [ "${os}" = windows ]; then
              (cd dist && zip -qr "${directory}.zip" "${directory}")
            else
              tar -C dist -czf "dist/${directory}.tar.gz" "${directory}"
            fi
            rm -r "dist/${directory}"
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
      - name: Smoke release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for archive in dist/*.tar.gz dist/*.zip; do
            case "${archive}" in
              *linux-amd64.tar.gz) ./scripts/binary-artifact-smoke.sh "${archive}" "${version}" ;;
              *) ./scripts/binary-artifact-smoke.sh "${archive}" "${version}" true ;;
            esac
          done
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
