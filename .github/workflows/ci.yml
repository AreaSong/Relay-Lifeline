name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run l10n:check
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:coverage
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: npm run release:check
        working-directory: web
      - run: go test ./...
        env:
          CGO_ENABLED: "0"
      - run: make race
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - name: Cross-build release targets
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/relay-lifeline-cross-build"
          mkdir -p "${output_dir}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [[ "${os}" == "windows" ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
              -o "${output_dir}/relay-lifeline-${os}-${arch}${suffix}" ./cmd/relay-lifeline
          done
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: ./scripts/ci-integration.sh
      - run: docker build -t relay-lifeline:ci .
      - run: ./scripts/container-smoke.sh relay-lifeline:ci
