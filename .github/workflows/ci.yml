name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run l10n:check
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test ./...
        env:
          CGO_ENABLED: "0"
      - run: make race
      - run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - run: ./scripts/ci-integration.sh
      - run: docker build -t relay-lifeline:ci .
      - run: ./scripts/container-smoke.sh relay-lifeline:ci
